<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Almoxarifado | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f7fa;

            color: #1f2937;
        }

        /* ===== CONTAINER ===== */

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
        }


        /* ===== LOGO ===== */

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 28px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;

            border-radius: 14px;

            color: white;

            font-size: 27px;

            margin-bottom: 14px;

            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
        }

        .logo h1 {
            font-size: 21px;

            font-weight: 600;

            color: #111827;
        }

        .logo p {
            margin-top: 5px;

            font-size: 13px;

            color: #9ca3af;
        }


        /* ===== CARD ===== */

        .login-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 32px;

            box-shadow:
                    0 10px 30px rgba(0, 0, 0, 0.04);
        }

        .login-card h2 {
            font-size: 20px;

            font-weight: 600;

            margin-bottom: 7px;

            color: #111827;
        }

        .login-card .description {
            color: #9ca3af;

            font-size: 13px;

            margin-bottom: 27px;
        }


        /* ===== FORM ===== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 500;

            color: #374151;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            height: 44px;

            padding: 0 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            font-size: 13px;

            color: #111827;

            background: white;

            transition: 0.2s;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                    0 0 0 3px rgba(37, 99, 235, 0.08);
        }


        /* ===== SENHA ===== */

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 7px;
        }

        .password-header label {
            margin: 0;
        }

        .forgot-password {
            color: #2563eb;

            text-decoration: none;

            font-size: 12px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }


        /* ===== BOTÃO ===== */

        .login-button {
            width: 100%;

            height: 44px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                    0 5px 12px rgba(37, 99, 235, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
        }


        /* ===== RODAPÉ ===== */

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #9ca3af;

            font-size: 11px;
        }


        /* ===== RESPONSIVO ===== */

        @media (max-width: 480px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            📦
        </div>

        <h1>Almoxarifado</h1>

        <p>Gerenciamento de recursos</p>

    </div>


    <!-- LOGIN -->

    <div class="login-card">

        <h2>Entrar</h2>

        <p class="description">
            Acesse sua conta para continuar.
        </p>


        <form th:action="@{/login}" method="post">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                >

            </div>


            <!-- SENHA -->

            <div class="form-group">

                <div class="password-header">

                    <label for="senha">
                        Senha
                    </label>

                    <a href="#" class="forgot-password">
                        Esqueceu a senha?
                    </a>

                </div>

                <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                >

            </div>


            <!-- BOTÃO -->

            <button
                    type="submit"
                    class="login-button">

                Entrar

            </button>

        </form>

    </div>


    <div class="footer">

        Sistema de Gerenciamento de Almoxarifado

    </div>


</div>


</body>

</html>
